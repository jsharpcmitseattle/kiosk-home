<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosk Home</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            background: #f4f4f9; 
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 80%; 
            max-width: 500px;
        }
        button, input { 
            padding: 15px; 
            margin: 10px 0; 
            font-size: 18px; 
            border-radius: 10px; 
            border: 1px solid #ccc; 
            width: 100%; 
            box-sizing: border-box; 
        }
        button { 
            background: #007AFF; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.2s;
        }
        button:active {
            background: #0056b3;
        }
        .survey-section { 
            margin-top: 30px; 
            border-top: 1px solid #eee; 
            padding-top: 20px; 
        }
        h1 { color: #333; margin-bottom: 20px; }
        h3 { color: #666; }
    </style>
</head>
<body>

<div class="card">
    <h1>Welcome</h1>
    
    <button onclick="window.location.href='https://theretirementsolution.com/communications-profile'">Communications Profile</button>

    <div class="survey-section">
        <h3>Personalized Survey</h3>
        <p>Please enter your ID/Code below:</p>
        <input type="text" id="surveyID" placeholder="Enter ID here...">
        <button onclick="goSurvey()" style="background: #34C759;">Open My Survey</button>
    </div>
</div>

<script>
    // --- SURVEY LOGIC ---
    function goSurvey() {
        var id = document.getElementById('surveyID').value;
        if (id) {
            // Replace the URL below with your actual survey base URL
            window.location.href = 'https://YOUR-SURVEY-LINK.com/' + encodeURIComponent(id);
        } else {
            alert('Please enter an ID');
        }
    }

    // --- IDLE TIMER LOGIC ---
    (function() {
        let timeout;
        const idleTimeLimit = 5 * 60 * 1000; // 5 minutes in milliseconds

        function resetToHome() {
            // Clear the input field for the next user
            document.getElementById('surveyID').value = '';
            // Refresh/Redirect to the home page URL
            window.location.href = window.location.pathname; 
        }

        function startTimer() {
            // Clear existing timer and start a new one
            clearTimeout(timeout);
            timeout = setTimeout(resetToHome, idleTimeLimit);
        }

        // List of events to watch for (touches, clicks, typing)
        const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'];
        
        events.forEach(function(name) {
            document.addEventListener(name, startTimer, true);
        });

        // Start the initial timer
        startTimer();
    })();
</script>

</body>
</html>
