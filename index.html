<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosk Home</title>
    <style>
        :root {
            --primary-blue: #007AFF;
            --primary-green: #34C759;
            --bg-gray: #f8f9fc;
            --text-dark: #333;
            --text-light: #666;
        }

        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            background: var(--bg-gray); 
        }

        .card { 
            background: white; 
            padding: 50px 40px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); 
            text-align: center; 
            width: 90%; 
            max-width: 500px;
        }

        h1 { font-size: 32px; font-weight: 700; color: var(--text-dark); margin: 0 0 30px 0; }
        h3 { font-size: 20px; font-weight: 600; color: var(--text-light); margin: 0 0 10px 0; }
        p { color: var(--text-light); margin-bottom: 20px; font-size: 16px; }

        .btn { 
            display: block;
            width: 100%;
            padding: 18px; 
            margin: 10px 0; 
            font-size: 18px; 
            font-weight: 700;
            border-radius: 12px; 
            border: none;
            cursor: pointer; 
            transition: opacity 0.2s, transform 0.1s;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn:active { transform: scale(0.98); opacity: 0.9; }

        .btn-blue { background: var(--primary-blue); color: white; }
        .btn-green { background: var(--primary-green); color: white; margin-top: 15px; }

        .divider {
            height: 1px;
            background: #eee;
            margin: 40px 0;
            border: none;
        }

        input { 
            width: 100%;
            padding: 16px; 
            font-size: 18px; 
            border-radius: 12px; 
            border: 1px solid #ddd; 
            background: #fafafa;
            box-sizing: border-box; 
            transition: border-color 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary-blue); background: white; }

        #browser-info {
            margin-top: 30px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="card">
