<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kiosk Home</title>
    <style>
        :root {
            --primary-blue: #007AFF;
            --primary-green: #34C759;
            --bg-gray: #f2f2f7; /* iOS system gray */
            --card-white: #ffffff;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            background-color: var(--bg-gray);
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* Prevents accidental scrolling/bouncing */
        }

        .card { 
            background: var(--card-white); 
            padding: 60px 40px; 
            border-radius: 24px; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.08); 
            text-align: center; 
            width: 85%; 
            max-width: 450px;
        }

        h1 { font-size: 36px; font-weight: 700; color: #000; margin: 0 0 40px 0; }

        .btn { 
            display: block;
            width: 100%;
            padding: 20px; 
            margin: 12px 0; 
            font-size: 20px; 
            font-weight: 600;
            border-radius: 14px; 
            border: none;
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s;
            box-sizing: border-box;
        }

        .btn-blue { background: var(--primary-blue); color: white; }
        .btn-blue:active { background: #0056b3; transform: scale(0.98); }
    </style>
</head>
<body>

<div class="card">
    <h1>Welcome</h1>
    
    <button class="btn btn-blue" onclick="window.location.href='https://www.insightsprofile.com/tomblack'">
        Communications Profile
    </button>
</div>

</body>
</html>
